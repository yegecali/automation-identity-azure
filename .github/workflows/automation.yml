  notificar_issue:
    needs: [abrir_issue, crear_app, delegar_permisos_graph, crear_client_secret_cc, persistir_auditoria_create, update_busqueda_app, update_configurar_redirect_uri, update_agregar_application_id_uri_ac, update_agregar_scopes_ac, update_agregar_application_id_uri_cc, update_agregar_app_roles_cc, persistir_auditoria_update]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Actualizar issue con resultado final
        uses: actions/github-script@v7
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          ISSUE_NUMBER: ${{ needs.abrir_issue.outputs.issue_number }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON || '{}');
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            const failedJobs = Object.entries(needs)
              .filter(([jobName, jobData]) => jobName !== 'abrir_issue' && jobData?.result === 'failure')
              .map(([jobName]) => jobName);

            const isSuccess = needs.delegar_permisos_graph?.result === 'success' || needs.persistir_auditoria_update?.result === 'success';

            if (failedJobs.length > 0) {
              const body = [
                'SCRIPT-ERROR',
                '',
                '### detalles',
                `Se presentó un error durante la ejecución en: ${failedJobs.join(', ')}`,
              ].join('\n');

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
                state: 'closed',
              });

              return;
            }

            if (isSuccess) {
              const clientId = needs.crear_app?.outputs?.app_id || 'N/A';
              const clientSecretAlias = needs.crear_client_secret_cc?.outputs?.client_secret_obfuscated || 'N/A';
              const grants = needs.delegar_permisos_graph?.outputs?.granted_scopes || 'N/A';
              const savedInTableStorage =
                needs.persistir_auditoria_create?.result === 'success' || needs.persistir_auditoria_update?.result === 'success'
                  ? 'SI'
                  : 'NO';

              const body = [
                'SCRIPT-SUCCESSFULL',
                '',
                '### detalles',
                `Client ID creado: ${clientId}`,
                `Alias del client secret: ${clientSecretAlias}`,
                `Grants aplicados: ${grants}`,
                `Se guardó en Table Storage: ${savedInTableStorage}`,
              ].join('\n');

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
                state: 'closed',
              });

              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'SCRIPT-USER',
              state: 'closed',
            });
