name: Run B2CC Automation (Python)

on:
  workflow_dispatch:
    inputs:
      operation:
        required: false
        type: choice
        options:
          - "01 - Creación"
          - "02 - Actualización"
      operation_label:
        required: false
        type: string
      app_name:
        required: false
        type: string
      env:
        required: false
        type: choice
        options:
          - "Desarrollo"
          - "Certificación"
          - "Producción"
      tennant:
        required: false
        type: choice
        options:
          - "B2C Core Persona"
          - "B2C Core PYME"
      type:
        required: false
        type: choice
        options:
          - "AC - Authorization Code con Login Unico"
          - "CC - Client Credentials"
      name:
        required: false
        type: string
      ticket_number:
        required: false
        type: string # itsm-12345
      channel:
        required: false
        type: string # nhbk
      webRedirectUri:
        required: false
        type: string # https://example.com/redirect
      scopes:
        required: false
        type: string # scope1,scope2,scope3
      applicationName:
        required: false
        type: string # cuando es actualizacion llega AC: b2c-auth-test-ac-client-id o CC: b2c-auth-test-cc-client-id
      userApp:
        required: false
        type: string # nombre de la aplicación del usuario
      singleCode:
        required: false
        type: string # codigo de 2
jobs:
  debug_dispatch_inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir inputs del dispatch
        shell: bash
        env:
          DISPATCH_INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          set -euo pipefail
          echo "Inputs recibidos en workflow_dispatch:"
          echo "$DISPATCH_INPUTS_JSON"
          echo "operation='${{ github.event.inputs.operation }}'"

  abrir_issue:
    needs: [debug_dispatch_inputs]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue_number: ${{ steps.crear_issue.outputs.issue_number }}
    steps:
      - name: Crear issue inicial (open)
        id: crear_issue
        uses: actions/github-script@v7
        env:
          TICKET_NUMBER: ${{ github.event.inputs.ticket_number }}
        with:
          script: |
            const createdIssue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: process.env.TICKET_NUMBER,
              body: 'SCRIPT-USER',
            });

            core.setOutput('issue_number', String(createdIssue.data.number));

  normalizar_inputs:
    needs: [debug_dispatch_inputs]
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.normalize.outputs.operation }}
      env: ${{ steps.normalize.outputs.env }}
      tennant: ${{ steps.normalize.outputs.tennant }}
      type: ${{ steps.normalize.outputs.type }}
    steps:
      - name: Normalizar operation/env/tennant/type del dispatch
        id: normalize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          operation_map = {
              "01 - Creación": "create",
              "02 - Actualización": "update",
              "create": "create",
              "update": "update",
          }
          env_map = {
              "Desarrollo": "dev",
              "Certificación": "cer",
              "Producción": "pro",
              "dev": "dev",
              "cer": "cer",
              "pro": "pro",
          }
          tennant_map = {
              "B2C Core Persona": "persona",
              "B2C Core PYME": "pyme",
              "persona": "persona",
              "pyme": "pyme",
          }
          type_map = {
              "AC - Authorization Code con Login Unico": "ac",
              "CC - Client Credentials": "cc",
              "ac": "ac",
              "cc": "cc",
          }

          raw_operation = "${{ github.event.inputs.operation }}".strip()
          raw_env = "${{ github.event.inputs.env }}".strip()
          raw_tennant = "${{ github.event.inputs.tennant }}".strip()
          raw_type = "${{ github.event.inputs.type }}".strip()

          print(f"operation={operation_map.get(raw_operation, raw_operation)}")
          print(f"env={env_map.get(raw_env, raw_env)}")
          print(f"tennant={tennant_map.get(raw_tennant, raw_tennant)}")
          print(f"type={type_map.get(raw_type, raw_type)}")
          PY

  crear_app_registration:
    needs: [normalizar_inputs, abrir_issue]
    if: ${{ needs.normalizar_inputs.outputs.operation == 'create' }}
    permissions:
      issues: write
    uses: ./.github/workflows/create-app-registration.yml
    secrets: inherit
    with:
      channel: ${{ github.event.inputs.channel }}
      env: ${{ needs.normalizar_inputs.outputs.env }}
      tennant: ${{ needs.normalizar_inputs.outputs.tennant }}
      type: ${{ needs.normalizar_inputs.outputs.type }}
      name: ${{ github.event.inputs.name }}
      user_app: ${{ github.event.inputs.userApp }}
      single_code: ${{ github.event.inputs.singleCode }}
      issue_number: ${{ needs.abrir_issue.outputs.issue_number }}
      ticket_number: ${{ github.event.inputs.ticket_number }}

  actualizar_app_registration:
    needs: [normalizar_inputs, abrir_issue]
    if: ${{ needs.normalizar_inputs.outputs.operation == 'update' }}
    permissions:
      issues: write
    uses: ./.github/workflows/update-app-registration.yml
    secrets: inherit
    with:
      env: ${{ needs.normalizar_inputs.outputs.env }}
      tennant: ${{ needs.normalizar_inputs.outputs.tennant }}
      type: ${{ needs.normalizar_inputs.outputs.type }}
      name: ${{ github.event.inputs.name }}
      application_name: ${{ github.event.inputs.applicationName }}
      web_redirect_uri: ${{ github.event.inputs.webRedirectUri }}
      scopes: ${{ github.event.inputs.scopes }}
      channel: ${{ github.event.inputs.channel }}
      user_app: ${{ github.event.inputs.userApp }}
      single_code: ${{ github.event.inputs.singleCode }}
      issue_number: ${{ needs.abrir_issue.outputs.issue_number }}
      ticket_number: ${{ github.event.inputs.ticket_number }}

  notificar_issue:
    needs: [abrir_issue, crear_app_registration, actualizar_app_registration]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Actualizar issue con resultado final
        uses: actions/github-script@v7
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          ISSUE_NUMBER: ${{ needs.abrir_issue.outputs.issue_number }}
          APPLICATION_NAME_INPUT: ${{ github.event.inputs.applicationName }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON || '{}');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const applicationNameInput = process.env.APPLICATION_NAME_INPUT || '';

            function formatExpiry(iso) {
              const isoText = String(iso || '').trim();
              if (!isoText) return 'N/A';
              const [datePart, timePartRaw] = isoText.split('T');
              if (!timePartRaw) return isoText;
              return `${datePart} ${timePartRaw.slice(0, 5)} UTC`;
            }

            async function closeIssue(body) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
                state: 'closed',
              });
            }

            const failedJobs = Object.entries(needs)
              .filter(([jobName, jobData]) => jobName !== 'abrir_issue' && jobData?.result === 'failure')
              .map(([jobName]) => jobName);

            if (failedJobs.length > 0) {
              const body = [
                'SCRIPT-ERROR',
                '',
                '######',
                '',
                '## ❌ Error en la ejecución',
                '',
                `⚠️ **Job(s) con fallo:** \`${failedJobs.join(', ')}\``,
              ].join('\n');

              await closeIssue(body);
              return;
            }

            const createResult = needs.crear_app_registration?.result;
            const updateResult = needs.actualizar_app_registration?.result;

            if (createResult === 'success') {
              const outputs = needs.crear_app_registration.outputs || {};
              const clientIdAlias = outputs.app_display_name || 'N/A';
              const clientId = outputs.app_id || 'N/A';
              const appType = outputs.app_type || 'N/A';
              const grants = outputs.granted_scopes || 'N/A';
              const savedInTableStorage = outputs.audit_status === 'persisted' ? '✅ Sí' : '❌ No';

              const lines = [
                'SCRIPT-SUCCESSFULL',
                '',
                '######',
                '',
                '## ✅ Creación completada',
                '',
                `🆔 **Alias Client ID:** \`${clientIdAlias}\``,
                `🔑 **Client ID:** \`${clientId}\``,
              ];

              if (appType === 'cc' && outputs.secret_status === 'created') {
                const secretAlias = outputs.client_secret_alias || `${clientIdAlias}-secret`;
                lines.push(`🔒 **Alias Client Secret:** \`${secretAlias}\``);
                lines.push(`⏳ **Vigencia del Client Secret:** hasta ${formatExpiry(outputs.client_secret_expires_at)}`);
              } else {
                lines.push('🔒 **Client Secret:** No aplica (flujo AC no usa client secret)');
              }

              lines.push(`🎯 **Scopes/Permisos otorgados:** \`${grants}\``);
              lines.push(`💾 **Guardado en Table Storage:** ${savedInTableStorage}`);

              await closeIssue(lines.join('\n'));
              return;
            }

            if (updateResult === 'success') {
              const outputs = needs.actualizar_app_registration.outputs || {};
              const clientIdAlias = applicationNameInput || 'N/A';
              const clientId = outputs.app_id || 'N/A';
              const appType = outputs.app_type || 'N/A';
              const redirectUri = outputs.redirect_uri || '';
              const scopesOrRoles = appType === 'cc'
                ? (outputs.app_roles_applied || 'N/A')
                : (outputs.scopes_applied || 'N/A');
              const savedInTableStorage = outputs.audit_status === 'persisted' ? '✅ Sí' : '❌ No';

              const lines = [
                'SCRIPT-SUCCESSFULL',
                '',
                '######',
                '',
                '## ✅ Actualización completada',
                '',
                `🆔 **Alias Client ID:** \`${clientIdAlias}\``,
                `🔑 **Client ID:** \`${clientId}\``,
              ];

              if (appType === 'cc') {
                lines.push(`🔒 **Alias Client Secret:** \`${clientIdAlias}-secret\``);
              } else {
                lines.push('🔒 **Client Secret:** No aplica (flujo AC no usa client secret)');
              }

              lines.push(`🎯 **Scopes/App Roles configurados:** \`${scopesOrRoles}\``);
              if (redirectUri) {
                lines.push(`🔗 **Redirect URI:** \`${redirectUri}\``);
              }
              lines.push(`💾 **Guardado en Table Storage:** ${savedInTableStorage}`);

              await closeIssue(lines.join('\n'));
              return;
            }

            await closeIssue('SCRIPT-USER');
