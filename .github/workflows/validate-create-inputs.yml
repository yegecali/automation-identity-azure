name: B2CC - Validate Create Inputs

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      env:
        required: true
        type: string
      tennant:
        required: true
        type: string
      type:
        required: true
        type: string
      name:
        required: true
        type: string
      issue_number:
        required: false
        type: string
        default: ""
    outputs:
      client_id_exists:
        value: ${{ jobs.validar_inputs_create.outputs.client_id_exists }}
      secret_alias_exists:
        value: ${{ jobs.validar_inputs_create.outputs.secret_alias_exists }}

jobs:
  validar_inputs_create:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      client_id_exists: ${{ steps.validar.outputs.client_id_exists }}
      secret_alias_exists: ${{ steps.validar.outputs.secret_alias_exists }}
    environment: ${{ inputs.env }}-${{ inputs.tennant }}
    env:
      B2CC_INPUT_OPERATION: create
      B2CC_INPUT_CHANNEL: ${{ inputs.channel }}
      B2CC_INPUT_ENV: ${{ inputs.env }}
      B2CC_INPUT_TENNANT: ${{ inputs.tennant }}
      B2CC_INPUT_TYPE: ${{ inputs.type }}
      B2CC_INPUT_NAME: ${{ inputs.name }}
      B2CC_TENANT_ID: ${{ secrets.TENANT_ID }}
      B2CC_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      B2CC_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar inputs de creación contra Graph
        id: validar
        shell: bash
        run: |
          set -euo pipefail
          python ./src/jobs/validate/validate_create_inputs_job.py \
            --comment-output ./artifacts/validate_create_comment.md

      - name: Comentar validación en el issue
        if: ${{ inputs.issue_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('./artifacts/validate_create_comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.issue_number }}'),
              body,
            });
